<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Habiv — build habits that feel like you." />
    <title>habiv</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7f5ef;
        --muted: #a7a79f;
        --background: #10110f;
        --accent: #c8f169;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 82% 18%, rgba(200, 241, 105, 0.18), transparent 25rem),
          radial-gradient(circle at 10% 90%, rgba(120, 100, 255, 0.14), transparent 24rem),
          var(--background);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(92vw, 1180px);
        padding: 3rem 0;
      }

      .eyebrow {
        margin: 0 0 1.5rem;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 100%;
        margin: 0;
        font-size: clamp(5rem, 20vw, 17rem);
        font-weight: 800;
        letter-spacing: -0.095em;
        line-height: 0.78;
      }

      .wordmark { margin-left: -0.07em; }

      .footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 2rem;
        margin-top: clamp(3rem, 10vw, 7rem);
        padding-top: 1.25rem;
        border-top: 1px solid rgba(247, 245, 239, 0.2);
      }

      .footer p {
        max-width: 20rem;
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .mark {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 3rem rgba(200, 241, 105, 0.35);
      }

      @media (max-width: 600px) {
        main { padding: 2rem 0; }
        .footer { align-items: start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Make room for better days</p>
      <h1 class="wordmark" aria-label="habiv">habiv</h1>
      <div class="footer">
        <p>Small rituals. Real momentum. A calmer way to become who you want to be.</p>
        <span class="mark" aria-hidden="true"></span>
      </div>
    </main>
  </body>
</html>
