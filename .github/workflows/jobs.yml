name: jobs

# The jobs that need Chromium or the engine converters. The app fires them with
# repository_dispatch (lib/jobs/trigger.ts); everything else runs on Vercel.
#   smoke-version   smoke test + cover/card screenshots after a version is ready
#   ingest-version  full ingest for Flash / Scratch / LÖVE bundles (converters), then smoke
#   render-thumb    render a thumbnail design (HTML) into a game's cover/card (MCP make_thumbnail)
on:
  repository_dispatch:
    types: [ingest-version, smoke-version, render-thumb]
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        type: choice
        options: [smoke-version, ingest-version, render-thumb]
        default: smoke-version
      version_id:
        description: game_versions.id (the thumbnail request id for render-thumb)
        required: true

concurrency:
  group: jobs-${{ github.event.client_payload.versionId || github.event.client_payload.requestId || inputs.version_id }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jobs
    env:
      # Passed through env (never interpolated into scripts) and validated below.
      TASK: ${{ github.event.action || inputs.task }}
      JOB_ID: ${{ github.event.client_payload.versionId || github.event.client_payload.requestId || inputs.version_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STORAGE_S3_REGION: ${{ secrets.STORAGE_S3_REGION }}
      STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.STORAGE_S3_ACCESS_KEY_ID }}
      STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_S3_SECRET_ACCESS_KEY }}
      GAME_ORIGIN: ${{ vars.GAME_ORIGIN || 'https://www.habiv.com' }}
    steps:
      - name: Validate input
        working-directory: .
        run: |
          [[ "$TASK" == "smoke-version" || "$TASK" == "ingest-version" || "$TASK" == "render-thumb" ]] || { echo "unknown task"; exit 1; }
          [[ "$JOB_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "bad id"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('jobs/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx tsx src/cli.ts "$TASK" "$JOB_ID"
