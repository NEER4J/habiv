<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Your verification code</title>
</head>
<body style="margin:0;padding:0;background:#f3f3f1;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your Habiv verification code.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f3f1;">
<tr><td align="center" style="padding:40px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
<tr><td style="padding:0 4px 18px;">
<a href="https://www.habiv.com" style="text-decoration:none;color:#050505;">
<img src="https://www.habiv.com/apple-icon" width="36" height="36" alt="" style="display:inline-block;vertical-align:middle;border-radius:9px;border:0;">
<span style="display:inline-block;vertical-align:middle;margin-left:10px;font:700 20px/1 'Space Grotesk',Helvetica,Arial,sans-serif;letter-spacing:-0.3px;color:#050505;">Habiv</span>
</a>
</td></tr>
<tr><td style="background:#ffffff;border:1px solid #e4e4e1;border-radius:16px;padding:36px 32px;">
<h1 style="margin:0 0 14px;font:700 24px/1.25 'Space Grotesk',Helvetica,Arial,sans-serif;letter-spacing:-0.4px;color:#050505;">Your verification code</h1>
<p style="margin:0 0 12px;font:15px/1.6 'Space Grotesk',Helvetica,Arial,sans-serif;color:#2b2b29;">Enter this code in Habiv to confirm it's you. It expires soon.</p><p style="margin:26px 0 8px;padding:18px 0;background:#f3f3f1;border:1px solid #e4e4e1;border-radius:10px;text-align:center;font:600 30px/1 'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:8px;color:#050505;">{{ .Token }}</p>
</td></tr>
<tr><td style="padding:22px 4px 0;font:12px/1.6 'Space Grotesk',Helvetica,Arial,sans-serif;color:#9b9b98;">
This email was sent to {{ .Email }}. If you didn't ask for a code, you can ignore this email.<br>
<a href="https://www.habiv.com" style="color:#636360;text-decoration:none;">habiv.com</a> &middot; Tiny games, made with AI.
</td></tr>
</table>
</td></tr>
</table>

</html>
