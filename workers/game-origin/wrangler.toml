# Game origin: serves extracted bundles from Supabase Storage on an isolated site (workers.dev
# is on the Public Suffix List, so game code can never read habiv.com cookies).
name = "habiv-play"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "VERSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
FRAME_ANCESTORS = "https://habiv.com https://*.habiv.com https://*.vercel.app http://localhost:3000"
GAMES_BUCKET = "habiv-games"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   SUPABASE_URL              https://apppassecstqpncmfyzw.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY service role key (version lookups and reading bundles from Storage)
#   HOOK_SECRET               shared with GAME_ORIGIN_HOOK_SECRET in the app / Vault
